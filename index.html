<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星函标签页</title>
    <link rel="icon" href="assets/logo_clear.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- 背景层 -->
    <div id="background-layer"></div>

    <!-- 半透明遮罩层 -->
    <div id="overlay"></div>

    <!-- 主内容容器 -->
    <div class="container">
        <!-- 顶部区域 -->
        <div class="top-section">
            <div class="title-div">
                <!-- 标题/Logo区域 -->
                <div id="title-area" class="title-area">
                    <span id="custom-title"></span>
                </div>
            </div>

            <!-- 占位用的空div -->
            <div class="title-div"></div>

            <!-- 必应信息按钮 -->
            <button id="bg-info-btn" class="bg-info-btn">
                <i class="fas fa-info-circle"></i>
            </button>

            <!-- 搜索引擎切换按钮紧挨着设置按钮左侧 -->
            <div class="engine-switcher-container">

                <button id="engine-switcher-btn" class="engine-switcher-btn">
                    <span id="engine-switcher-name"></span>
                    <i id="engine-switcher-caret" class="fas fa-caret-down"></i>
                </button>

                <div id="engine-switcher-dropdown" class="engine-switcher-dropdown hidden">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 设置按钮 -->
            <button id="settings-btn" class="settings-btn">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </div>

    <!-- 搜索区域 -->
    <div class="search-container">
        <form id="search-form" class="search-form" autocomplete="off">
            <div id="jump-bubble" class="jump-bubble hidden">
                当前将直接跳转至: <span id="jump-bubble-text"></span>
            </div>
            <div class="search-box">
                <div class="search-input-container" id="search-input-container">
                    <input type="text" id="search-input" class="search-input" placeholder="加载中……" autocomplete="off"
                        autocapitalize="off" spellcheck="false" />
                    <button type="submit" class="search-btn">
                        <i class="fas fa-search"></i>
                        <span class="search-btn-text">搜索</span>
                    </button>
                </div>
                <div id="search-history-list" class="search-history-list"></div>
            </div>
        </form>
    </div>

    <!-- 快速链接区域 -->
    <div id="quick-links-container" class="quick-links-container"></div>
    </div>

    <!-- 设置面板遮罩 -->
    <div id="settings-overlay" class="settings-overlay"></div>

    <!-- 设置面板 -->
    <div id="settings-panel" class="settings-panel">
        <div class="settings-header">
            <div class="settings-header-top">
                <h2>设置</h2>
                <button id="close-settings" class="close-settings">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="settings-tabs">
                <button class="tab-btn active" data-tab="tab-search">搜索引擎</button>                <button class="tab-btn" data-tab="tab-quick-links">快速链接</button>                <button class="tab-btn" data-tab="tab-general">常规</button>
                <button class="tab-btn" data-tab="tab-appearance">外观</button>
                <button class="tab-btn" data-tab="tab-data">数据</button>
                <button class="tab-btn" data-tab="tab-about">关于</button>
            </div>
        </div>

        <div class="settings-content">
            <!-- 搜索引擎 -->
            <div class="settings-tab-pane active" id="tab-search">
                <div class="settings-section">
                    <h3>搜索引擎</h3>
                <div class="settings-dropdown-container" id="settings-engine-dropdown-container">
                    <div id="settings-engine-select-btn" class="settings-select">
                        <span id="settings-engine-name"></span>
                        <i class="fas fa-caret-down" style="pointer-events: none;"></i>
                    </div>
                    <div id="settings-engine-dropdown" class="engine-switcher-dropdown hidden" style="width: 100%; top: 100%; margin-top: 5px;">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <div id="search-engines-editor" class="quick-links-editor" style="display: block; margin-top: 15px; margin-bottom: 15px;">
                    <h3>管理搜索引擎</h3>
                    <label class="setting-label">支持使用 %s 表示搜索关键字</label>
                    <div id="engines-list" class="links-list">
                        <!-- 搜索引擎将在这里动态生成 -->
                    </div>
                    <button id="add-engine-btn" class="add-link-btn">
                        <i class="fas fa-plus"></i> 添加搜索引擎
                    </button>
                </div>

                <div class="setting-item" style="margin-top: 5px;">
                    <label class="setting-label">启用搜索引擎快速切换</label>
                    <label class="switch">
                        <input type="checkbox" id="engine-switch-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="setting-item" style="margin-top: 5px;">
                    <label class="setting-label">启用输入网址后直接跳转</label>
                    <label class="switch">
                        <input type="checkbox" id="direct-jump-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            </div>

            <!-- 快速链接设置 -->
            <div class="settings-tab-pane" id="tab-quick-links">
                <div class="settings-section">
                    <h3>快速链接</h3>
                    <div class="setting-item">
                        <label class="setting-label">启用快速链接</label>
                        <label class="switch">
                            <input type="checkbox" id="quick-links-toggle" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>

                    <div id="quick-links-editor" class="quick-links-editor">
                        <h3>管理快速链接</h3>
                        <label class="setting-label">最多可以添加 10 个快速链接</label>
                        <div id="links-list" class="links-list">
                            <!-- 快速链接将在这里动态生成 -->
                        </div>
                        <button id="add-link-btn" class="add-link-btn">
                            <i class="fas fa-plus"></i> 添加快速链接
                        </button>
                    </div>
                </div>
            </div>

            <!-- 常规设置 -->
            <div class="settings-tab-pane" id="tab-general">
            <!-- 历史记录设置 -->
            <div class="settings-section">
                <h3>历史记录</h3>
                <div class="setting-item">
                    <label class="setting-label">显示历史记录</label>
                    <label class="switch">
                        <input type="checkbox" id="show-history-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <label class="setting-label">最多可以保存 10 条历史记录</label>
                    <label id="clear-history-btn" class="clear-history-btn">
                        <i class="fas fa-trash"></i> 清除全部历史记录
                    </label>
                </div>
            </div>

            <hr class="section-divider">

            <!-- 标题设置 -->
            <div class="settings-section">
                <h3>标题</h3>
                <div class="setting-item">
                    <label class="setting-label">显示标题</label>
                    <label class="switch">
                        <input type="checkbox" id="show-title-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <label class="setting-label" for="custom-title-input">自定义标题文字</label>
                    <input type="text" id="custom-title-input" class="text-input" placeholder="请输入标题文字">
                </div>
            </div>
            </div>

            <!-- 外观设置 -->
            <div class="settings-tab-pane" id="tab-appearance">
            <!-- 背景设置 -->
            <div class="settings-section">
                <h3>背景</h3>
                <label class="setting-label">背景来源</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="bg-type" value="bing" checked>
                        <span>每日一图</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="bg-type" value="color">
                        <span>纯色背景</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="bg-type" value="image">
                        <span>本地图片</span>
                    </label>
                </div>

                <!-- 纯色背景设置 -->
                <div class="setting-item bg-color-setting hidden">
                    <label class="setting-label" for="bg-color-picker">背景颜色</label>
                    <div class="theme-color-controls">
                        <input type="color" id="bg-color-picker" class="color-picker" value="#ffffff">
                        <span id="bg-color-hex" class="color-hex-label">#FFFFFF</span>
                    </div>
                </div>

                <!-- 本地图片设置 -->
                <div class="setting-item bg-image-setting hidden">
                    <label class="setting-label block-label">选择图片</label>
                    <div class="image-upload-container">
                        <label for="bg-image-upload" class="image-upload-btn">
                            <i class="fas fa-upload"></i> 选择图片
                        </label>
                        <input type="file" id="bg-image-upload" class="image-upload" accept="image/*">
                    </div>
                    <div id="image-preview-container" class="image-preview-container hidden">
                        <p class="preview-label">图片预览</p>
                        <img id="image-preview" class="image-preview" src="" alt="图片预览">
                    </div>
                </div>


                <div class="setting-item">
                    <label class="setting-label" for="overlay-opacity" style="margin-top: 8px;">不透明度</label>
                    <div class="opacity-control">
                        <input type="range" id="overlay-opacity" min="0" max="100" value="50" class="opacity-slider">
                        <span class="opacity-value">50%</span>
                    </div>
                    <div class="opacity-labels">
                        <span>透明</span>
                        <span style="color: var(--theme-color);">不透明</span>
                    </div>
                </div>

                <div class="setting-item">
                    <label class="setting-label">启用背景信息查看</label>
                    <label class="switch">
                        <input type="checkbox" id="bg-info-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>

            <hr class="section-divider">

            <!-- 主题色设置 -->
            <div class="settings-section">
                <h3>主题色</h3>
                <div class="setting-item">
                    <label class="setting-label" for="theme-color-picker">选择主题颜色</label>
                    <div class="theme-color-controls">
                        <input type="color" id="theme-color-picker" class="color-picker" value="#6366f1">
                        <span id="theme-color-hex" class="color-hex-label">#6366F1</span>
                    </div>
                </div>
            </div>

            <hr class="section-divider">

            <!-- 显示模式设置 -->
            <div class="settings-section">
                <h3>显示模式</h3>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="display-mode" value="system" checked>
                        <span>跟随系统</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="display-mode" value="light">
                        <span>浅色模式</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="display-mode" value="dark">
                        <span>深色模式</span>
                    </label>
                </div>
            </div>
            </div>

            <!-- 数据与设置管理 -->
            <div class="settings-tab-pane" id="tab-data">
                <div class="settings-section">
                    <h3>数据</h3>
                    <div class="setting-item">
                        <label class="setting-label">导入设置</label>
                        <div class="import-export-controls">
                            <label for="import-settings" class="import-btn">
                                <i class="fas fa-upload"></i> 导入
                            </label>
                            <input type="file" id="import-settings" class="import-input" accept=".json">
                            <span id="import-filename" class="import-filename">未选择文件</span>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">导出设置</label>
                        <label id="export-settings" class="export-btn">
                            <i class="fas fa-download"></i> 导出
                        </label>
                    </div>
                </div>
            </div>

            <!-- 关于 -->
            <div class="settings-tab-pane" id="tab-about">
                <div class="settings-section">
                    <h3>关于</h3>
                <div class="setting-item">
                    <img src="./assets/logo_clear.png" alt="星函标签页"
                        style="display:block;width:100px;margin:0 auto 18px auto;border-radius:25%;">
                    <label class="setting-label" style="font-weight: 700;">星函标签页<br>STARPLEX PURETAB</label>
                    <label class="setting-label">让每一次上网都赏心悦目</label>
                    <label class="setting-label" style="width: 100%; display: flex;">
                        <label style="width: 50%; text-align: left;">版本</label>
                        <label id="about-version" style="width: 50%; text-align: right;"></label>
                    </label>
                    <label class="setting-label" style="width: 100%; display: flex;">
                        <label style="width: 50%; text-align: left;">作者</label>
                        <label style="width: 50%; text-align: right;">Jance</label>
                    </label>
                    <label class="setting-label" style="width: 100%; display: flex;">
                        <label style="width: 50%; text-align: left;">更新日志</label>
                        <label style="width: 50%; text-align: right;">
                            <a href="https://starplex.top/product-puretab#updatelogs" class="about-link-btn">查看</a>
                        </label>
                    </label>
                    <label class="setting-label" style="width: 100%; display: flex;">
                        <label style="width: 50%; text-align: left;">官方网站</label>
                        <label style="width: 50%; text-align: right;">
                            <a href="https://starplex.top/product-puretab" class="about-link-btn">前往</a>
                        </label>
                    </label>
                    <label class="setting-label" style="width: 100%; display: flex;">
                        <label style="width: 50%; text-align: left;">仓库地址</label>
                        <label style="width: 50%; text-align: right;">
                            <a id="repo-link" href="#" class="about-link-btn" target="_blank">前往</a>
                        </label>
                    </label>
                </div>
            </div>

            <hr class="section-divider">

            <!-- 反馈 -->
            <div class="settings-section">
                <h3>反馈</h3>
                <div class="setting-item">
                    <label class="setting-label" style="width: 100%; display: flex;">
                        <label style="width: 50%; text-align: left;">联系我们</label>
                        <label style="width: 50%; text-align: right;">
                            <a href="https://starplex.top/contact?product=puretab" class="about-link-btn">前往</a>
                        </label>
                    </label>
                </div>
            </div>


            <hr class="section-divider">

            <!-- 版权信息 -->
            <div class="settings-section">
                <h3>说明</h3>
                <div class="setting-item">
                    <label class="setting-label" style="width: 100%; display: flex;">
                        <label style="width: 100%; text-align: left;">“星函标签页”插件仅供学习交流使用，不得用于任何商业性质的活动。</label>
                    </label>
                    <label class="setting-label" style="width: 100%; display: flex;">
                        <label style="width: 100%; text-align: left;">“星函标签页”插件是开源项目，遵循 MIT
                            开源协议，允许二次开发和进行非商业性质的宣发活动。在二次开发后，应当注明“星函标签页”项目的仓库地址和作者信息。</label>
                    </label>
                    <label class="setting-label" style="width: 100%; display: flex;">
                        <label
                            style="width: 100%; text-align: left;">“星函标签页”插件中，“每日一图”功能所需的图片来自 Microsoft Bing 壁纸，相关图片仅作为本插件的可选壁纸使用，不用于任何商业性质的活动。相关图片的版权信息，请点击每日一图背景信息查阅。</label>
                    </label>
                </div>
            </div>
            </div>

        </div>

        <div class="settings-footer">
            <div class="history-actions">
                <button id="undo-settings" class="history-btn" title="撤销" disabled>
                    <i class="fas fa-undo"></i>
                </button>
                <button id="redo-settings" class="history-btn" title="恢复" disabled>
                    <i class="fas fa-redo"></i>
                </button>
            </div>
            <button id="reset-settings" class="reset-btn">
                <i class="fas fa-trash-restore"></i> 重置
            </button>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="toast hidden"></div>

    <!-- 自定义弹窗 -->
    <div id="custom-modal" class="custom-modal hidden">
        <div class="custom-modal-mask"></div>
        <div class="custom-modal-dialog">
            <div class="custom-modal-content">
                <div id="custom-modal-message" class="custom-modal-message"></div>
                <div class="custom-modal-actions">
                    <button id="custom-modal-cancel" class="custom-modal-btn cancel">取消</button>
                    <button id="custom-modal-ok" class="custom-modal-btn ok">确定</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="settings.js"></script>
</body>

</html>
